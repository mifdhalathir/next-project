<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Karsa Cafe Padang</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        cream: { 50:'#fefdf8', 100:'#fdf6e3', 200:'#f5ead0', 300:'#e8d5a8' },
        wood: { 600:'#5d4037', 700:'#4a3728', 800:'#3e2723', 900:'#2c1a12' },
      },
      fontFamily: { display:['Playfair Display','serif'], body:['Inter','sans-serif'] }
    }
  }
}
</script>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c1a12">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<!-- If you enabled Analytics in your project, add the Firebase SDK for Analytics -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-wood-800">

<!-- Page Transition Overlay -->
<div id="pageTransition" class="page-transition"></div>

<!-- Animated Mesh Gradient -->
<div class="mesh-gradient-container">
    <div class="mesh-ball mesh-ball-1"></div>
    <div class="mesh-ball mesh-ball-2"></div>
    <div class="mesh-ball mesh-ball-3"></div>
</div>

<!-- Login Card -->
<div class="login-card relative z-10 w-full max-w-md mx-4">
    <div class="glass-login rounded-3xl p-10 shadow-2xl" id="loginStepContainer">
        <div class="text-center mb-10">
            <h1 class="font-display text-4xl font-bold text-white tracking-[0.2em]">KARSA <span class="text-amber-500">CAFE</span></h1>
            <div class="w-16 h-1 bg-amber-500 mx-auto mt-4 mb-4 rounded-full"></div>
            <p id="defaultSubtitle" class="text-stone-300 text-sm tracking-widest uppercase">Ruang Inspirasi</p>
        </div>
        
        <!-- Login Form Wrapper -->
        <div id="loginFormWrapper">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-cream-200 text-xs font-bold uppercase tracking-widest mb-2">Nama Lengkap / Email</label>
                    <input id="userName" type="text" required placeholder="Masukkan namamu..." class="w-full bg-white/5 border border-white/10 text-white placeholder-stone-500 rounded-xl px-4 py-4 text-sm focus:outline-none focus:border-amber-500 focus:bg-white/10 transition-all">
                </div>
                
                <div>
                    <label class="block text-cream-200 text-xs font-bold uppercase tracking-widest mb-2">Password</label>
                    <input id="password" type="password" required placeholder="Masukkan password..." class="w-full bg-white/5 border border-white/10 text-white placeholder-stone-500 rounded-xl px-4 py-4 text-sm focus:outline-none focus:border-amber-500 focus:bg-white/10 transition-all">
                </div>

                <button type="submit" id="loginBtn" class="w-full bg-amber-700 hover:bg-amber-600 text-white py-4 rounded-xl text-sm font-bold tracking-[0.2em] uppercase transition-all transform hover:scale-[1.05] btn-glow">Login Manual</button>
                
                <div class="relative flex items-center justify-center mt-6 mb-6">
                    <div class="border-t border-white/10 w-full"></div>
                    <span class="text-stone-400 text-xs px-3 bg-wood-800 absolute font-medium tracking-widest">ATAU</span>
                </div>

                <button type="button" id="googleLoginBtn" class="w-full bg-white/10 hover:bg-white/20 border border-white/10 text-white py-4 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Sign in with Google
                </button>
            </form>
            <p class="text-center text-stone-400 text-xs mt-8 font-medium">Belum punya akun? <span class="text-amber-500 cursor-pointer hover:text-amber-400 font-bold" onclick="toggleAuthMode('register')">Daftar di Sini</span></p>
        </div>

        <!-- Register Form Wrapper (Hidden by default) -->
        <div id="registerFormWrapper" class="hidden">
            <form id="registerForm" class="space-y-6">
                <div>
                    <label class="block text-cream-200 text-xs font-bold uppercase tracking-widest mb-2">Nama Lengkap</label>
                    <input id="regName" type="text" required placeholder="Masukkan nama lengkap..." class="w-full bg-white/5 border border-white/10 text-white placeholder-stone-500 rounded-xl px-4 py-4 text-sm focus:outline-none focus:border-amber-500 focus:bg-white/10 transition-all">
                </div>

                <div>
                    <label class="block text-cream-200 text-xs font-bold uppercase tracking-widest mb-2">Email</label>
                    <input id="regEmail" type="email" required placeholder="Masukkan email..." class="w-full bg-white/5 border border-white/10 text-white placeholder-stone-500 rounded-xl px-4 py-4 text-sm focus:outline-none focus:border-amber-500 focus:bg-white/10 transition-all">
                </div>
                
                <div>
                    <label class="block text-cream-200 text-xs font-bold uppercase tracking-widest mb-2">Password</label>
                    <input id="regPassword" type="password" required placeholder="Buat password..." class="w-full bg-white/5 border border-white/10 text-white placeholder-stone-500 rounded-xl px-4 py-4 text-sm focus:outline-none focus:border-amber-500 focus:bg-white/10 transition-all">
                </div>

                <div>
                    <label class="block text-cream-200 text-xs font-bold uppercase tracking-widest mb-2">Konfirmasi Password</label>
                    <input id="regConfirmPassword" type="password" required placeholder="Ulangi password..." class="w-full bg-white/5 border border-white/10 text-white placeholder-stone-500 rounded-xl px-4 py-4 text-sm focus:outline-none focus:border-amber-500 focus:bg-white/10 transition-all">
                </div>

                <button type="submit" id="registerBtn" class="w-full bg-amber-700 hover:bg-amber-600 text-white py-4 rounded-xl text-sm font-bold tracking-[0.2em] uppercase transition-all transform hover:scale-[1.05] btn-glow">Daftar Sekarang</button>
            </form>
            <p class="text-center text-stone-400 text-xs mt-8 font-medium">Sudah punya akun? <span class="text-amber-500 cursor-pointer hover:text-amber-400 font-bold" onclick="toggleAuthMode('login')">Login di Sini</span></p>
        </div>

    </div>

    <!-- Modal Pilihan Meja (Step 2) -->
    <div id="tableModal" class="hidden absolute top-0 left-0 w-full glass-login rounded-[3rem] p-12 shadow-[0_30px_100px_rgba(0,0,0,0.8)] transform transition-all scale-95 opacity-0">
        <div class="mb-6 text-center">
            <img id="userAvatar" src="" class="w-14 h-14 rounded-full mx-auto mb-3 border-2 border-amber-500 hidden object-cover shadow-[0_0_15px_rgba(245,158,11,0.5)]">
            <p class="text-white/70 text-xs uppercase tracking-widest font-bold">Selamat datang,</p>
            <p id="welcomeName" class="text-amber-500 font-display text-2xl font-bold mt-1"></p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-white/50 text-[10px] font-black uppercase tracking-[0.2em] mb-2">Pilih Area</label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="modalArea" value="Indoor" class="peer sr-only" checked>
                        <div class="text-center py-3 rounded-xl border border-white/5 bg-white/5 text-white/50 peer-checked:bg-amber-500/20 peer-checked:border-amber-500 peer-checked:text-amber-500 transition-all font-black text-xs uppercase tracking-widest">Indoor</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="modalArea" value="Outdoor" class="peer sr-only">
                        <div class="text-center py-3 rounded-xl border border-white/5 bg-white/5 text-white/50 peer-checked:bg-amber-500/20 peer-checked:border-amber-500 peer-checked:text-amber-500 transition-all font-black text-xs uppercase tracking-widest">Outdoor</div>
                    </label>
                </div>
            </div>

            <div class="relative">
                <select id="modalTableNumber" class="w-full bg-white/5 border border-white/5 text-white rounded-2xl px-6 py-4 text-xs font-black tracking-widest uppercase focus:outline-none focus:border-amber-500 focus:bg-white/10 transition-all appearance-none cursor-pointer">
                    <option value="" class="bg-stone-950">PILIH NOMOR MEJA</option>
                    <option value="01" class="bg-stone-950">MEJA 01</option>
                    <option value="02" class="bg-stone-950">MEJA 02</option>
                    <option value="03" class="bg-stone-950">MEJA 03</option>
                </select>
                <span class="absolute right-6 top-1/2 -translate-y-1/2 text-white/20 pointer-events-none">🪑</span>
            </div>

            <p id="tableWarning" class="text-red-400 text-[10px] uppercase font-black tracking-widest text-center mt-2 hidden">Pilih meja dulu, Ngab!</p>

            <button type="button" id="goToMenuBtn" disabled class="w-full disabled:bg-white/10 disabled:text-white/30 disabled:cursor-not-allowed bg-amber-600 hover:bg-amber-500 text-white py-5 rounded-2xl text-xs font-black tracking-[0.4em] uppercase transition-all shadow-2xl active:scale-95 btn-glow mt-6">MASUK KE MENU</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script>
  // Setup config Firebase lo di sini Ngab
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID"
  };

  if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }

  const googleLoginBtn = document.getElementById('googleLoginBtn');

  // Override script.js Google Login event listener with a visual alert
  if (googleLoginBtn) {
      // Remove existing listener to prevent duplicate execution
      const newBtn = googleLoginBtn.cloneNode(true);
      googleLoginBtn.parentNode.replaceChild(newBtn, googleLoginBtn);
      
      newBtn.addEventListener('click', () => {
          if (firebaseConfig.apiKey === "YOUR_API_KEY") {
              alert('Simulasi Google Login berhasil! (Ganti API Key untuk koneksi Google asli)');
              const dummyName = "Sultan " + Math.floor(Math.random() * 1000);
              
              const loginStepContainer = document.getElementById('loginStepContainer');
              const tableModal = document.getElementById('tableModal');
              const userAvatar = document.getElementById('userAvatar');
              const welcomeName = document.getElementById('welcomeName');
              
              if(loginStepContainer) loginStepContainer.classList.add('hidden');
              if(tableModal) {
                  tableModal.classList.remove('hidden');
                  setTimeout(() => {
                      tableModal.classList.remove('scale-95', 'opacity-0');
                      tableModal.classList.add('scale-100', 'opacity-100');
                  }, 50);
              }
              if (welcomeName) welcomeName.textContent = dummyName;
              if (userAvatar) {
                  userAvatar.src = "https://ui-avatars.com/api/?name=Sultan&background=f59e0b&color=fff";
                  userAvatar.classList.remove('hidden');
              }
              localStorage.setItem('karsa_user_name', dummyName);
              localStorage.setItem('karsa_user_avatar', "https://ui-avatars.com/api/?name=Sultan&background=f59e0b&color=fff");
              return;
          }
          const provider = new firebase.auth.GoogleAuthProvider();
          firebase.auth().signInWithPopup(provider).then((result) => {
              // Same logic handled in script.js but we re-trigger here if needed
          }).catch((err) => alert('Login Gagal: ' + err.message));
      });
  }
</script>
</body>
</html>
